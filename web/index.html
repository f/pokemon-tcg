<body>
  <a class="skip" href="#main" data-i18n="nav.skip"></a>
  <header class="top">
    <a class="brand" href="./" aria-label="Pokémon TCG Academy">
      <img src="icon-64.png" alt="" width="32" height="32">
      <span>TCG Academy</span>
    </a>
    <nav class="top-links">

    </nav>
    <div class="lang" role="group" aria-label="Language" data-i18n-aria="lang.label">
      <button data-lang="en" lang="en" title="English">EN</button><button data-lang="tr" lang="tr" title="Türkçe">TR</button><button data-lang="ja" lang="ja" title="日本語">JA</button><button data-lang="es" lang="es" title="Español">ES</button>
    </div>

  <main id="main">
    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n-html="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="cta">
          <div class="cta-item"><a class="btn primary" href="play/" data-i18n="hero.play"></a><span class="cta-sub" data-i18n="hero.play.sub"></span></div>
          <div class="cta-item"><a class="btn ghost" href="#download" data-i18n="hero.mac"></a><span class="cta-sub" data-i18n="hero.mac.sub"></span></div>
        </div>
        <p class="fine" data-i18n="hero.note"></p>
      </div>
      <div class="hero-art">
        <img class="shot" src="screenshots/board.webp" srcset="screenshots/board-800.webp 800w, screenshots/board.webp 1600w" sizes="(max-width: 960px) 100vw, 58vw" width="1600" height="1000" fetchpriority="high" data-i18n-alt="alt.board" alt="">
        <div class="fan" aria-hidden="true">
          <img src="https://images.pokemontcg.io/base1/58.png" alt="" width="245" height="342">
          <img src="https://images.pokemontcg.io/base1/4.png" alt="" width="245" height="342">
          <img src="https://images.pokemontcg.io/sv3/125.png" alt="" width="245" height="342">
        </div>
      </div>

        </div>
        <div class="way">
          <h3 data-i18n="ways.mac.title"></h3>
          <p data-i18n="ways.mac.text"></p>
          <a class="textlink" href="#download" data-i18n="ways.mac.go"></a>
        </div>
      </div>

        <thead><tr><th></th><th scope="col" data-i18n="cmp.web"></th><th scope="col" data-i18n="cmp.mac"></th></tr></thead>
        <tbody>
          <tr><th scope="row" data-i18n="cmp.cpu"></th><td class="yes">✓</td><td class="yes">✓</td></tr>
          <tr><th scope="row" data-i18n="cmp.kev"></th><td class="no">—</td><td class="yes">✓</td></tr>
          <tr><th scope="row" data-i18n="cmp.jev"></th><td class="no">—</td><td class="yes">✓</td></tr>

          <tr><th scope="row" data-i18n="cmp.install"></th><td class="yes">✓</td><td class="no">—</td></tr>
        </tbody>

        <div><h2 data-i18n="feat.help.title"></h2><p data-i18n="feat.help.text"></p></div>
      </article>
      <article class="feature flip">
        <img src="screenshots/attack.webp" srcset="screenshots/attack-800.webp 800w, screenshots/attack.webp 1600w" sizes="(max-width: 760px) 100vw, 60vw" width="1600" height="1000" loading="lazy" data-i18n-alt="alt.attack" alt="">

            <img src="https://images.pokemontcg.io/base1/4.png" alt="" width="245" height="342" loading="lazy">

          <p data-i18n="decks.classic.text"></p>
        </div>
        <div class="era">
          <div class="era-fan" aria-hidden="true">
            <img src="https://images.pokemontcg.io/me2/56.png" alt="" width="245" height="342" loading="lazy">
            <img src="https://images.pokemontcg.io/sv3/125.png" alt="" width="245" height="342" loading="lazy">
